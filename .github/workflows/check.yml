name: check

# PR 和 push 都跑 `make check`：lint（含密钥扫描）+ 单元测试 + 构建 + 端到端 + 复核所有 passing 的功能项。
# 复核（make features）就在 make check 里：每个 state=passing 的功能项会重跑 verification，
# 并核对 verified.digest；任何一项失败，整个 job 失败，PR 就不能合并。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # job 名必须叫 check：交付插件（ops/delivery.json 的 check.job）按这个名字找。
  # 所以这里不能用 matrix（会把 job 名变成 "check (ubuntu-latest)"）。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: make check（lint + test + build + e2e + 复核 passing 功能项）
        run: make check
